plugins { id 'com.android.application' }

android {
    namespace 'com.huseyin.sonnobet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.huseyin.sonnobet.audit26'
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName '1.26.0'
        testInstrumentationRunner 'com.huseyin.sonnobet.BackupInstrumentation'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
