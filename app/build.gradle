plugins { id 'com.android.application' }

android {
    namespace 'com.huseyin.sonnobet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.huseyin.sonnobet.audit13'
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName '1.13.0'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
