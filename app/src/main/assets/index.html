<script>
"use strict";
var KEY="son-nobet-v1";
var base={screen:"home",read:[false,false,false],pick:[null,null,null],quiz:{},xp:0,passed:false,lastDay:"",streak:0,initial:"",sound:true,visited:false};
var s=load();
function load(){try{var z=JSON.parse(localStorage.getItem(KEY));return Object.assign({},base,z,{quiz:z.quiz||{},read:Array.isArray(z.read)?z.read.slice(0,3):base.read.slice(),pick:Array.isArray(z.pick)?z.pick.slice(0,3):base.pick.slice()});}catch(e){return Object.assign({},base,{read:base.read.slice(),pick:base.pick.slice(),quiz:{}})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function touch(){var t=today();if(s.lastDay!==t){var y=new Date();y.setDate(y.getDate()-1);var p=y.getFullYear()+"-"+("0"+(y.getMonth()+1)).slice(-2)+"-"+("0"+y.getDate()).slice(-2);s.streak=s.lastDay===p?s.streak+1:1;s.lastDay=t}save()}
function h(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function sound(){if(!s.sound)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.setValueAtTime(620,c.currentTime);o.frequency.exponentialRampToValueAtTime(980,c.currentTime+.11);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.22)}catch(e){}}
function toggleSound(){s.sound=!s.sound;save();render()}
function go(v){s.screen=v;touch();save();render();window.scrollTo(0,0)}
function award(x){s.xp+=x;touch();sound();save()}
function pct(){return Math.round((s.read.filter(Boolean).length+(s.passed?1:0))/4*100)}
var lessons=[
 {name:"Potasyum Alarmı",time:"5–7 dk",source:"24 — Sıvı-Elektrolit Dengesi Bozuklukları / FBT16_01",heading:"Düz kas neden yavaşlar?",content:[
 "Potasyum (K⁺), özellikle <strong>kas ve sinir hücrelerinin elektriksel uyarılabilirliği</strong> için gereklidir. Hücre dışındaki K⁺ düzeyinin düşmesi membran elektrik dengesini etkiler. Bağırsak duvarındaki düz kasın kasılması bozulduğunda hareketler yavaşlayabilir.",
 "<strong>Hipokalemi</strong>, serum K⁺ değerinin <strong>3,5 mEq/L altına</strong> düşmesidir. Klinik olarak kabızlık, abdominal distansiyon ve ağır durumlarda paralitik ileusla ilişkilidir. Buna bağırsak seslerinde azalma eşlik edebilir.",
 "Sık nedenler: kusma/ishal gibi gastrointestinal kayıplar, diüretikler nedeniyle renal kayıp ve potasyumun hücre içine kayması. Kas güçsüzlüğü, kramplar, çarpıntı ve EKG değişiklikleri (özellikle T dalga düzleşmesi, U dalgası) eşlik edebilir.",
 "<strong>Sözlü formülü:</strong> Elektrolit bozukluğu → düz kas işlevi azalır → peristaltizm yavaşlar → bağırsak sesleri azalabilir. Ancak yalnız dinleme ile ileus tanısı konmaz."
 ],check:"Hipokalemi için temel laboratuvar eşiği hangisi?",options:["K⁺ < 3,5 mEq/L","K⁺ > 5,5 mEq/L","Na⁺ < 135 mEq/L"],correct:0},
 {name:"Kalsiyum Tuzağı",time:"5–7 dk",source:"Paratiroid / Endokrin Hipertansiyon — FBT16_02",heading:"Yüksek kalsiyum, yavaş bağırsak",content:[
 "Kalsiyum yalnız kemikle ilgili değildir; <strong>sinir-kas uyarılabilirliği</strong> üzerinde de rol oynar. <strong>Hiperkalsemi</strong> gastrointestinal motiliteyi azaltabilir. Bu nedenle kabızlık, bulantı ve belirgin olgularda ileus görülebilir.",
 "Hiperkalsemide kalsiyumun hücre membranı üzerindeki etkileri kas ve sinir uyarılabilirliğini azaltır. Klinik tabloya halsizlik, poliüri, susama, taş öyküsü veya nöropsikiyatrik belirtiler de eşlik edebilir.",
 "Başlıca nedenlerden ikisi <strong>primer hiperparatiroidizm</strong> ve <strong>malignite</strong>dir. PTH ölçümü neden araştırmasında önemli bir ayırıcı basamaktır. Toplam kalsiyumun albumin ile ilişkisini ve gerektiğinde iyonize kalsiyumu düşün.",
 "<strong>FBT için karşılaştır:</strong> Hipokalemi ve hiperkalsemi iki ayrı bozukluktur; ikisi de bağırsak hareketlerini azaltabilir. Tek başına herhangi bir laboratuvar sonucu bütün abdominal tabloyu açıklamaz."
 ],check:"Hiperkalsemide en tipik gastrointestinal yakınmalardan biri?",options:["Kabızlık","Sulu diyare","Kanlı kusma"],correct:0},
 {name:"Batın Nöbeti",time:"5–7 dk",source:"8 — Abdomen Muayenesi / FBT16_03",heading:"Duyduğun sesin klinik anlamı",content:[
 "Karın muayenesine hastayı rahatlatıp doğru pozisyon vererek başlarız. Temel akış <strong>inspeksiyon → oskültasyon → perküsyon → palpasyon</strong> şeklindedir. Dinlemeyi diğer manevralardan önce yaparız.",
 "Bağırsak seslerinde azalma <strong>hipomotilite</strong> ile uyumlu olabilir. Paralitik ileus, bazı elektrolit bozuklukları, peritonit ve ilaçlar klinik bağlama göre değerlendirilir. Seslerin bir an duyulmaması otomatik olarak bağırsak felci demek değildir.",
 "Mekanik obstrüksiyonun erken döneminde yüksek perdeli/artmış sesler duyulabilir; ileri dönemde sesler azalabilir. Distansiyon, kusma, gaz ve dışkı çıkaramama, cerrahi öykü ve muayene bulguları birlikte değerlendirilmelidir.",
 "<strong>Sözlüde güvenli yanıt:</strong> 'Hipokalemi ve hiperkalsemi bağırsak seslerinde azalma yapabilir. Ancak ses azalması tek başına tanı koydurmaz; anamnez, muayene ve gerekirse görüntüleme ile değerlendiririm.'"
 ],check:"Batın muayenesinde genellikle hangi işlem palpasyondan önce yapılır?",options:["Oskültasyon","Derin palpasyon","Rebound testi"],correct:0}
];
var quiz=[
 {q:"FBT #016: Barsak seslerini azaltabilen iki elektrolit bozukluğu hangileridir?",a:["Hipokalemi ve hiperkalsemi","Hipernatremi ve hipofosfatemi","Hiperkalemi ve hipokalsemi","Hiponatremi ve hipokloremi"],c:0,why:"Orijinal FBT sayfa 6 yanıtı: hipokalemi ve hiperkalsemi."},
 {q:"K⁺ = 2,8 mEq/L ve karında distansiyon: motilite azalmasının ilişkili olabileceği durum?",a:["Hiperkalemi","Hipokalemi","Hiperkalsemi","Hipernatremi"],c:1,why:"2,8 mEq/L, 3,5'in altında; hipokalemi bağırsak düz kas aktivitesini bozabilir."},
 {q:"Hiperkalsemili bir hastada hangi gastrointestinal yakınma daha beklenir?",a:["Kabızlık","Melena","Sürekli kanlı ishal","Hematemez"],c:0,why:"Hiperkalsemi bağırsak motilitesini azaltarak kabızlık yapabilir."},
 {q:"Karın muayenesinde temel sıralama hangisidir?",a:["Palpasyon → oskültasyon → inspeksiyon → perküsyon","İnspeksiyon → oskültasyon → perküsyon → palpasyon","Perküsyon → palpasyon → oskültasyon → inspeksiyon","Oskültasyon → palpasyon → inspeksiyon → perküsyon"],c:1,why:"Oskültasyon, manevralar bağırsak aktivitesini etkileyebileceği için önce yapılır."},

function renderHud(){document.getElementById("sound").textContent=s.sound?"♪":"♩";document.getElementById("hud").innerHTML='<div class="hud"><div class="stat"><small>SEVİYE</small><strong>16</strong></div><div class="stat"><small>TOPLAM XP</small><strong class="count">'+s.xp+'</strong></div><div class="stat"><small>GÜN SERİSİ</small><strong>'+s.streak+' 🔥</strong></div></div>'}
function home(){return '<div class="eyebrow">SINAVA KADAR GÖREV MODU · 04 KASIM</div><h1>SON <span style="color:var(--cyan)">NÖBET</span><br>başlıyor.</h1><p class="lead">Ders çalışmak yerine görevlere gir. Her bölüm: FBT sorusu, üç kısa ders ve bir klinik kontrol.</p><div class="panel hero"><div class="row"><span class="chip">'+(s.passed?'TAMAMLANDI':'AKTİF GÖREV')+'</span><span class="tag">FBT · #016</span></div><h2 style="margin-top:18px">Elektrolit Krizi</h2><p class="muted">Barsak seslerini azaltan elektrolit bozukluğu?</p><div class="progress"><div class="bar" style="width:'+pct()+'%"></div></div><div class="row mini"><span>'+s.read.filter(Boolean).length+'/3 ders + final sınavı</span><strong>'+pct()+'%</strong></div><button class="btn" onclick="go(\''+(s.passed?'victory':s.visited?'map':'intro')+'\')">'+(s.passed?'BAŞARI RAPORUNU AÇ':s.visited?'GÖREVE DEVAM ET':'GÖREVE BAŞLA →')+'</button></div><div class="dividerHead">SIRADAKİ GÖREVLER</div><div class="panel miniLevel"><div class="row"><div><b>17 · Dirençli Hipertansiyon</b><div class="caption">İçerik henüz yüklenmedi</div></div><span class="chip lock">KİLİTLİ</span></div></div><div class="panel miniLevel"><div class="row"><div><b>18 · Ranson Kriterleri</b><div class="caption">İçerik henüz yüklenmedi</div></div><span class="chip lock">KİLİTLİ</span></div></div><button class="btn ghost" onclick="reset()">İlerlemeyi sıfırla</button>'}
function intro(){s.visited=true;save();return '<button class="btn alt small" onclick="go(\'home\')">← ANA MENÜ</button><div class="panel hero"><span class="chip">LEVEL 16 · GÖREV BRİFİNGİ</span><h1>ELEKTROLİT<br>KRİZİ</h1><p class="quest">Barsak seslerini azaltan elektrolit bozukluğu?</p><p class="mini">FBT PDF · Sayfa 6 · Orijinal soru 16. Önce aklından geçen cevabı yaz. Doğru cevabı şimdi göstermeyeceğiz.</p><textarea id="initial" placeholder="Hocam, öncelikle ..." spellcheck="false">'+h(s.initial)+'</textarea><button class="btn" onclick="start()">3 DERSLİK GÖREVE GİR →</button></div>'}
function start(){var e=document.getElementById("initial");s.initial=e?e.value.trim():"";s.visited=true;touch();go("map")}
function map(){var done=s.read.filter(Boolean).length;var cards=lessons.map(function(l,i){return '<button class="path '+(s.read[i]?'done ':'')+'" onclick="go(\'lesson'+i+'\')"><b>0'+(i+1)+'</b>'+l.name+'<br><span class="caption">'+l.time+'</span></button>'}).join("");return '<button class="btn alt small" onclick="go(\'home\')">← ANA MENÜ</button><div class="eyebrow" style="margin-top:24px">GÖREV HARİTASI · LEVEL 16</div><h1>Bilgiyi<br>silaha dönüştür.</h1><p class="lead">Her ders en fazla 10 dakikalık okuma hedefiyle hazırlandı. Öğrenme kontrolünü geçince ders tamamlanır.</p><div class="panel"><div class="row"><strong>ÖĞRENME İLERLEMESİ</strong><span class="tag">'+done+'/3</span></div><div class="progress"><div class="bar" style="width:'+(done/3*100)+'%"></div></div><div class="paths">'+cards+'</div><div class="sep"></div><h3>SON KAPI · KLİNİK KONTROL</h3><p class="mini">5 soru, geçmek için en az 4 doğru. Sorular gerçek FBT bilgisinden türetilmiştir.</p><button class="btn" '+(done<3?'disabled ':'')+'onclick="go(\'quiz\')">'+(s.passed?'SINAVI TEKRAR OYNA':done<3?'ÖNCE 3 DERSİ BİTİR':'FİNAL SINAVINA GİR →')+'</button></div>'}
function lesson(i){var l=lessons[i],v=s.pick[i];var txt=l.content.map(function(p){return '<p>'+p+'</p>'}).join("");var opts=l.options.map(function(x,j){return '<button class="option '+(v===j?'selected':'')+'" onclick="pickLesson('+i+','+j+')">'+h(x)+'</button>'}).join("");return '<button class="btn alt small" onclick="go(\'map\')">← GÖREV HARİTASI</button><div class="eyebrow" style="margin-top:23px">DERS 0'+(i+1)+' / 03 · '+l.time.toUpperCase()+'</div><h1>'+l.name+'</h1><p class="caption">KAYNAK: '+l.source+'</p><div class="panel lesson"><h2>'+l.heading+'</h2>'+txt+'</div><div class="panel"><div class="step">AKTİF HATIRLAMA · +30 XP</div><h3 style="margin-top:10px">'+l.check+'</h3>'+opts+(s.read[i]?'<div class="success">✓ Bu dersin öğrenme kontrolünü geçtin. +30 XP kazanıldı.</div>':'<button class="btn" onclick="checkLesson('+i+')" '+(v===null?'disabled':'')+'>CEVABI KONTROL ET</button>')+'<div id="feedback"></div></div><button class="btn ghost" onclick="go(\'map\')">HARİTAYA DÖN</button>'}
function pickLesson(i,j){if(s.read[i])return;s.pick[i]=j;save();render()}
function checkLesson(i){if(s.read[i])return;var f=document.getElementById("feedback");if(s.pick[i]===lessons[i].correct){s.read[i]=true;award(30);render()}else{f.innerHTML='<div class="hint">Tekrar düşün. Bu dersin temel kavramına dön ve bir kez daha dene.</div>';sound()}}
function quizView(){return '<button class="btn alt small" onclick="go(\'map\')">← GÖREV HARİTASI</button><div class="eyebrow" style="margin-top:24px">BOSS FIGHT · FBT #016</div><h1>KLİNİK<br>YOKLAMA</h1><p class="lead">5 soru · En az 4 doğru ile geç. Sonuçlar teslim edene kadar gösterilmez.</p>'+quiz.map(function(q,i){var os=q.a.map(function(a,j){return '<button class="option '+(s.quiz[i]===j?'selected':'')+'" onclick="pickQuiz('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+h(a)+'</button>'}).join("");return '<div class="panel"><div class="qnum">SORU '+(i+1)+'/5</div><h3>'+h(q.q)+'</h3>'+os+'</div>'}).join("")+'<button class="btn" '+(Object.keys(s.quiz).length<5?'disabled':'')+' onclick="finish()">SINAVI BİTİR VE PUANLA →</button>'}
function pickQuiz(i,j){s.quiz[i]=j;save();render()}
function finish(){var n=quiz.filter(function(q,i){return s.quiz[i]===q.c}).length;s.score=n;if(n>=4&&!s.passed){s.passed=true;award(100)}else{touch();save();sound()}go("victory")}
function victory(){var n=typeof s.score==="number"?s.score:(s.passed?5:0),pass=n>=4;var corrections=quiz.map(function(q,i){var right=s.quiz[i]===q.c;return '<div class="panel"><span class="'+(right?'chip':'tag danger')+'">'+(right?'✓ DOĞRU':'✕ TEKRAR')+'</span><h3 style="margin-top:9px">'+q.q+'</h3><p class="mini">'+q.why+'</p></div>'}).join("");return '<div class="eyebrow">'+(pass?'GÖREV TAMAMLANDI':'GÖREV TEKRARI')+'</div><div class="panel hero" style="text-align:center"><div class="reward">'+(pass?'🏆':'🩺')+'</div><h1>'+(pass?'LEVEL 16<br>GEÇİLDİ!':'BİR TUR DAHA')+'</h1><h2>'+n+' / 5 DOĞRU</h2><p class="lead" style="margin:auto">'+(pass?'+100 XP! FBT #016 için ilk sınav hedefini geçtin. Kalıcılık için farklı gün tekrar et.':'Hedef 4 doğru. Kaçırdığın bilgileri gözden geçir ve yeniden dene.')+'</p><button class="btn" onclick="go(\''+(pass?'oral':'map')+'\')">'+(pass?'SÖZLÜ PROVAYA GEÇ':'GÖREV HARİTASINA DÖN')+'</button></div><div class="dividerHead">SORU GERİ BİLDİRİMLERİ</div>'+corrections+'<button class="btn alt" onclick="s.quiz={};save();go(\'quiz\')">FİNALİ YENİDEN OYNA</button><button class="btn ghost" onclick="go(\'home\')">ANA MENÜ</button>'}
function oral(){return '<button class="btn alt small" onclick="go(\'victory\')">← SONUÇ</button><div class="eyebrow" style="margin-top:24px">OPSİYONEL · SÖZLÜ SİMÜLASYONU</div><h1>Hoca<br>karşında.</h1><div class="panel hero"><div class="quest">“Hocam, bağırsak sesleri azalmış. Hangi iki elektrolit bozukluğunu düşünürsün ve mekanizması nedir?”</div><p class="mini">Cevabını ekrana bakmadan sesli söyle. Sonra örnek yanıtı aç.</p><textarea id="oral" placeholder="Kendi sözlü cevabını yazmak istersen..."></textarea><button class="btn" onclick="document.getElementById(\'model\').hidden=false;this.disabled=true">ÖRNEK SÖZLÜ YANITINI AÇ</button><div id="model" hidden><div class="success"><strong>Örnek yanıt:</strong> Hipokalemi ve hiperkalsemi bağırsak düz kasının uyarılabilirliğini ve motiliteyi azaltabilir. Kabızlık, distansiyon ve ileri olguda paralitik ileus görülebilir. Ancak yalnız ses azalması tanı koydurmaz; klinikle birlikte değerlendiririm.</div><p class="mini">Bu bir öz değerlendirmedir; uygulama yazılı serbest yanıtı yapay zekâyla puanlamaz.</p></div></div><div class="panel"><h3>⏳ TEKRAR GÖREVİ</h3><p class="mini">Yarın farklı bir olgu ile yeniden hatırla. Uygulama şimdilik otomatik bildirim göndermez.</p></div><button class="btn alt" onclick="go(\'home\')">ANA MENÜYE DÖN</button>'}
function reset(){if(confirm("Bütün yerel XP, ders ve sınav ilerlemesini sıfırlamak istiyor musun?")){localStorage.removeItem(KEY);s=load();render()}}

window.appBack=function(){go("home")};render();
