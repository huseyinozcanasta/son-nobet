name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'test/**'
      - 'scripts/**'
      - 'release.json'
      - 'release-notes.md'
      - 'docs/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: son-nobet-android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release metadata
        run: |
          node scripts/set-version.cjs
          git diff --exit-code
          node - <<'JS'
          const fs=require('fs'),m=require('./release.json');
          if(!/^Son Nöbet \d+\.\d+$/.test(m.label)||m.notesFile!=='release-notes.md'||/[\r\n]/.test(m.title))throw Error('Unsafe release metadata');
          fs.appendFileSync(process.env.GITHUB_ENV,`RELEASE_VERSION=${m.version}\nRELEASE_TAG=v${m.version}\nRELEASE_APP_ID=${m.applicationId}\nRELEASE_LABEL=${m.label}\nRELEASE_TITLE=${m.title}\n`);
          JS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check FBT audit integrity and study flow
        run: node scripts/test-all.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Play every new quest on a mobile viewport and restore its backup
        env:
          QA_SCREENSHOT: /tmp/son-nobet-mobile.png
        run: node test/browser-smoke.cjs
      - name: Upload mobile test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: son-nobet-mobile-qa
          path: /tmp/son-nobet-mobile.png
          if-no-files-found: error
      - name: Build debug APK
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Validate the APK before publishing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" | tail -1
          unzip -p "$APK" assets/content-v02.js | grep -Fq "Potasyum Alarmı"
          unzip -p "$APK" assets/content-v115.js | grep -Fq "Dirençli Hipertansiyon"
          unzip -p "$APK" assets/content-v116.js | grep -Fq "contentRevision"
          unzip -p "$APK" assets/quest-v115.js | grep -Fq "NOBET115"
          unzip -p "$APK" assets/game-v02.js | grep -Fq "gameOpen"
          unzip -p "$APK" assets/bank-10.js | grep -Fq "\"number\":443"
          unzip -p "$APK" assets/game-v1.js | grep -Fq "443 KAPI"
          unzip -p "$APK" assets/audit-v11.js | grep -Fq "originalPdfCheckedRange"
          unzip -p "$APK" assets/audit-v12.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v13.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v14.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v15.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v16.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v17.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v18.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v110.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v111.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/mechanisms-v19.js | grep -Fq "\"diagrams\""
          unzip -p "$APK" assets/mechanisms-v110.js | grep -Fq "source"
          unzip -p "$APK" assets/mechanisms-v111.js | grep -Fq "source"
          unzip -p "$APK" assets/mechanisms-v112.js | grep -Fq "sourceAuditPending"
          unzip -p "$APK" assets/mechanisms-v113.js | grep -Fq "digitalDocxCompared"
          unzip -p "$APK" assets/mechanisms-v114.js | grep -Fq "sourceAuditPending"
          unzip -p "$APK" assets/docx-crosscheck-v114.js | grep -Fq "originalHandwritingVisualChecked"
          unzip -p "$APK" assets/docx-crosscheck-v113.js | grep -Fq "originalHandwritingVisualChecked"
          unzip -p "$APK" assets/preflight-v112.js | grep -Fq "sourceVisualChecked"
          unzip -p "$APK" assets/release-center-v19.js | grep -Fq "son-nobet-progress"
          unzip -p "$APK" assets/slide-candidates-v12.js | grep -Fq "topicHits"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/son-nobet-badging.txt
          grep -Fq "application-label:'$RELEASE_LABEL'" /tmp/son-nobet-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/son-nobet-signing.txt
          # apksigner skips v1 verification for packages with minSdk >= 24 even if JAR signatures exist.
          unzip -Z1 "$APK" | grep -Fq "META-INF/CERT.RSA"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/son-nobet-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n "$RELEASE_APP_ID/com.huseyin.sonnobet.MainActivity"
            sleep 5
            adb shell pidof "$RELEASE_APP_ID"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w "$RELEASE_APP_ID.test/com.huseyin.sonnobet.BackupInstrumentation" | tee /tmp/son-nobet-native-backup.txt
            grep -Fq "SON_NOBET_ANDROID_BACKUP_PASS" /tmp/son-nobet-native-backup.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: son-nobet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish pre-release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_NAME="SonNobet-$RELEASE_TAG-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          # Published binaries are immutable: use a new version for a new build.
          gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
