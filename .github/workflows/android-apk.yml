name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'test/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check FBT audit integrity and study flow
        run: node test/audit-smoke.cjs
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Validate the APK before publishing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" | tail -1
          unzip -p "$APK" assets/content-v02.js | grep -Fq "Potasyum Alarmı"
          unzip -p "$APK" assets/game-v02.js | grep -Fq "gameOpen"
          unzip -p "$APK" assets/bank-10.js | grep -Fq "\"number\":443"
          unzip -p "$APK" assets/game-v1.js | grep -Fq "443 KAPI"
          unzip -p "$APK" assets/audit-v11.js | grep -Fq "originalPdfCheckedRange"
          unzip -p "$APK" assets/audit-v12.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v13.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v14.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v15.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v16.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v17.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/audit-v18.js | grep -Fq "originalVisualChecked"
          unzip -p "$APK" assets/slide-candidates-v12.js | grep -Fq "topicHits"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/son-nobet-badging.txt
          grep -Fq "application-label:'Son Nöbet 1.8'" /tmp/son-nobet-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/son-nobet-signing.txt
          # apksigner skips v1 verification for packages with minSdk >= 24 even if JAR signatures exist.
          unzip -Z1 "$APK" | grep -Fq "META-INF/CERT.RSA"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/son-nobet-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK"
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch on Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.huseyin.sonnobet.audit8/com.huseyin.sonnobet.MainActivity
            sleep 5
            adb shell pidof com.huseyin.sonnobet.audit8
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: son-nobet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish pre-release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SonNobet-v1.8.0-debug.apk
          if gh release view v1.8.0 >/dev/null 2>&1; then
            gh release upload v1.8.0 SonNobet-v1.8.0-debug.apk --clobber
          else
            gh release create v1.8.0 SonNobet-v1.8.0-debug.apk --target "$GITHUB_SHA" --title "Son Nöbet 1.8 — 442 cevap için kalite taraması ve 261 görsel denetim" --notes "442 FBT kaynak sorusu ve 261 soruda el yazısı PDF görsel denetimi; 181 soruda inceleme bekliyor. Soru 16 uzun dersleri korunur. Debug APK, çevrimdışı, Android 12 emülatör testi." --prerelease
          fi
